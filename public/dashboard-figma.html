<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finwa Dashboard - Streak Mingguan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard-figma.css">
</head>
<body>

<main class="dashboard">

    <!-- ===== Banner Streak ===== -->
    <section class="streak-banner">
        <h1 class="banner-title">Catatanmu rapi minggu ini,<br>Lanjut, dikit lagi target!</h1>
        <img class="banner-art" src="https://coresg-normal.trae.ai/api/ide/v1/text_to_image?prompt=cute%203d%20illustration%20of%20happy%20character%20celebrating%20with%20golden%20coins%20and%20checklist%20clipboard%2C%20playful%20flat%20style%2C%20warm%20maroon%20and%20orange%20palette%2C%20soft%20rounded%20shapes%2C%20plain%20solid%20background%2C%20no%20text%2C%20no%20watermark&image_size=landscape_4_3" alt="Ilustrasi perayaan streak pencatatan">
    </section>

    <!-- ===== Streak Mingguan ===== -->
    <section class="weekly-streak" aria-label="Streak pencatatan mingguan">
        <!-- Selasa: selesai -->
        <div class="streak-col done">
            <span class="day-label">Tue</span>
            <div class="streak-card">
                <span class="day-num">17</span>
                <svg class="check-icon" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true"><path d="M9.55 17.6 4.4 12.45l1.62-1.62 3.53 3.54 8.43-8.44 1.62 1.62-10.05 10.05Z"/></svg>
            </div>
        </div>
        <!-- Rabu: selesai (kartu ungu solid) -->
        <div class="streak-col done today-complete">
            <span class="day-label">Wed</span>
            <div class="streak-card">
                <span class="day-num">18</span>
                <svg class="check-icon" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true"><path d="M9.55 17.6 4.4 12.45l1.62-1.62 3.53 3.54 8.43-8.44 1.62 1.62-10.05 10.05Z"/></svg>
            </div>
        </div>
        <!-- Kamis: hari aktif -->
        <div class="streak-col active">
            <span class="day-label">Thu</span>
            <div class="streak-card">
                <span class="day-num">19</span>
                <div class="streak-dots" aria-hidden="true">
                    <span></span><span></span>
                </div>
            </div>
        </div>
        <!-- Jumat: mendatang -->
        <div class="streak-col upcoming">
            <span class="day-label">Fri</span>
            <div class="streak-card">
                <span class="day-num">20</span>
            </div>
        </div>
        <!-- Sabtu: mendatang -->
        <div class="streak-col upcoming">
            <span class="day-label">Sat</span>
            <div class="streak-card">
                <span class="day-num">21</span>
            </div>
        </div>
    </section>

    <!-- ===== Pemasukan & Pengeluaran ===== -->
    <section class="summary-row">
        <div class="summary-card income">
            <span class="summary-label">Pemasukan</span>
            <span class="summary-amount">Rp 9.800.000</span>
        </div>
        <div class="summary-card expense">
            <span class="summary-label">Pengeluaran</span>
            <span class="summary-amount">Rp 2.100.000</span>
        </div>
    </section>

</main>

<!-- ===== Bottom Navigation (BNB-27) ===== -->
<nav class="bottom-nav" aria-label="Navigasi utama">
    <a href="#" class="nav-item active" aria-label="Home">
        <div class="nav-bubble">
            <svg viewBox="0 0 24 24" fill="#ffbb46" aria-hidden="true"><path d="M10.8 2.9a2 2 0 0 1 2.4 0l7.4 5.3c.7.5 1.4 1.7 1.4 2.6v7c0 2-1.6 3.7-3.6 3.7H5.6c-2 0-3.6-1.7-3.6-3.7v-7.1c0-.8.6-2 1.3-2.5l7.5-5.3Z"/><path d="M12 9.5c-1.5 0-2.75 1.2-2.75 2.75V20h5.5v-7.75c0-1.5-1.25-2.75-2.75-2.75Z" fill="#ffffff"/></svg>
        </div>
        <span class="nav-label">Home</span>
    </a>
    <a href="#" class="nav-item" aria-label="Search">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#9db2ce" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg>
        <span class="nav-label">Search</span>
    </a>
    <a href="#" class="nav-item" aria-label="Cart">

        <span class="nav-label">Cart</span>
    </a>
    <a href="#" class="nav-item" aria-label="Profile">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="#9db2ce" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M4.5 20.5c0-3.7 3.4-6.2 7.5-6.2s7.5 2.5 7.5 6.2"/></svg>
        <span class="nav-label">Profile</span>
    </a>
</nav>

</body>
</html>
